<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Plug n Drive - Unsubscribe</title>
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<style>
:root{--navy:#1a3260;--blue:#3a8fd4;--off:#f5f8fc;--border:#dde5f0;--muted:#6b7a9a;--green:#16a34a;--red:#dc2626}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--off);color:var(--navy);font-family:Arial,Helvetica,sans-serif;font-size:15px;line-height:1.6;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}
.card{width:100%;max-width:460px;background:#fff;border:1px solid var(--border);border-radius:14px;padding:28px;text-align:center}
h1{font-size:20px;margin-bottom:10px}
p{color:var(--muted);margin-bottom:18px}
button{background:var(--blue);color:#fff;border:0;border-radius:8px;padding:12px 22px;font-size:15px;font-weight:700;cursor:pointer}
button[disabled]{opacity:.6;cursor:default}
.ok{color:var(--green);font-weight:700}
.bad{color:var(--red);font-weight:700}
.small{font-size:12px;margin-top:18px;margin-bottom:0}
</style>
</head>
<body>
<div class="card">
  <h1 id="title">Unsubscribe</h1>
  <p id="msg">Confirm that you no longer want to receive offers by e-mail.</p>
  <button id="btn" type="button">Unsubscribe</button>
  <p class="small">Plug n Drive, operated by RC Tradeworx Holdings (Pty) Ltd, South Africa.</p>
</div>
<script>
(function(){
  var ENDPOINT = 'https://ozlnxhtguaoeuhjeejxq.supabase.co/functions/v1/campaign-mail/unsub';
  var t = new URLSearchParams(location.search).get('t') || '';
  var title = document.getElementById('title'), msg = document.getElementById('msg'), btn = document.getElementById('btn');
  function bad(text){ title.textContent = 'Link not valid'; msg.textContent = text; msg.className = 'bad'; btn.style.display = 'none'; }
  if (!/^[0-9a-f]{36}$/.test(t)) { bad('This unsubscribe link is invalid or incomplete. Please use the link from the latest e-mail you received.'); return; }
  btn.addEventListener('click', function(){
    btn.disabled = true; btn.textContent = 'Please wait...';
    fetch(ENDPOINT, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ t: t }) })
      .then(function(r){ return r.json(); })
      .then(function(d){
        if (d && d.ok) {
          title.textContent = 'You are unsubscribed';
          msg.textContent = d.brand ? 'You will no longer receive offers from ' + d.brand + ' by e-mail.' : 'You will no longer receive these offers by e-mail.';
          msg.className = 'ok'; btn.style.display = 'none';
        } else { bad('We could not process this link. It may be invalid or already used.'); }
      })
      .catch(function(){ btn.disabled = false; btn.textContent = 'Unsubscribe'; msg.textContent = 'Network problem. Please try again.'; msg.className = 'bad'; });
  });
})();
</script>
</body>
</html>
