<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Plug n Drive - Your coupon</title>
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<style>
:root{--navy:#1a3260;--blue:#3a8fd4;--off:#f5f8fc;--border:#dde5f0;--muted:#6b7a9a;--green:#16a34a;--red:#dc2626;--amber:#b8791a}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--off);color:var(--navy);font-family:Arial,Helvetica,sans-serif;font-size:15px;line-height:1.6;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}
.card{width:100%;max-width:420px;background:#fff;border:1px solid var(--border);border-radius:14px;padding:24px;text-align:center}
.brand{font-size:14px;color:var(--muted)}
h1{font-size:22px;margin:4px 0 8px}
.msg{color:var(--muted);white-space:pre-wrap;margin-bottom:14px}
.qr{width:220px;height:220px;margin:6px auto 10px}
.qr svg{width:100%;height:100%;display:block}
.code{display:inline-block;font:700 22px/1 ui-monospace,Menlo,Consolas,monospace;letter-spacing:2px;border:1px dashed var(--blue);border-radius:8px;padding:12px 14px;margin-bottom:12px;user-select:all}
.badge{display:inline-block;font-weight:700;font-size:13px;border-radius:999px;padding:4px 12px;margin-bottom:10px}
.valid{background:#e6f6ec;color:var(--green)} .used{background:#fdecec;color:var(--red)} .expired{background:#fdf3e1;color:var(--amber)}
.small{font-size:12px;color:var(--muted);margin-top:14px}
</style>
</head>
<body>
<div class="card" id="card">
  <h1 id="title">Your coupon</h1>
  <p class="msg" id="msg">Loading...</p>
</div>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<script>
(function(){
  var ENDPOINT = 'https://ozlnxhtguaoeuhjeejxq.supabase.co/functions/v1/campaign-mail/coupon';
  var card = document.getElementById('card');
  function el(tag, cls, text){ var e = document.createElement(tag); if(cls) e.className = cls; if(text != null) e.textContent = text; return e; }
  function fmt(s){ try { return new Date(s).toLocaleDateString(undefined, { day: 'numeric', month: 'long', year: 'numeric' }); } catch(e){ return ''; } }
  function fail(text){ card.textContent = ''; card.appendChild(el('h1', null, 'Coupon not found')); card.appendChild(el('p', 'msg', text)); }
  var t = new URLSearchParams(location.search).get('t') || '';
  if(!/^[0-9a-f]{36}$/.test(t)){ fail('This link is invalid or incomplete. Please use the link from your e-mail.'); return; }
  fetch(ENDPOINT + '?t=' + encodeURIComponent(t)).then(function(r){ return r.json(); }).then(function(d){
    if(!d || d.status === 'not_found' || !d.code){ fail('This coupon could not be found. It may not have been sent yet.'); return; }
    card.textContent = '';
    if(d.brand) card.appendChild(el('div', 'brand', d.brand));
    card.appendChild(el('h1', null, d.offer_name || 'Your offer'));
    if(d.message) card.appendChild(el('p', 'msg', d.message));
    var label = { valid: 'Valid' + (d.expires_at ? ' until ' + fmt(d.expires_at) : ''), used: 'Already used' + (d.redeemed_at ? ' on ' + fmt(d.redeemed_at) : ''), expired: 'Expired' + (d.expires_at ? ' on ' + fmt(d.expires_at) : '') }[d.status] || '';
    if(label) card.appendChild(el('div', 'badge ' + d.status, label));
    if(d.status === 'valid'){
      var qrBox = el('div', 'qr');
      try { var qr = qrcode(0, 'M'); qr.addData(d.code); qr.make(); qrBox.innerHTML = qr.createSvgTag({ cellSize: 6, margin: 2, scalable: true }); card.appendChild(qrBox); } catch(e){ /* the code below is enough */ }
    }
    card.appendChild(el('div', 'code', d.code));
    card.appendChild(el('p', 'small', d.status === 'valid' ? 'Show this screen at the till. The code works once.' : 'This code can no longer be used.'));
  }).catch(function(){ fail('Network problem. Please try again.'); });
})();
</script>
</body>
</html>
